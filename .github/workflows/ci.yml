name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run doctests
        run: python -m doctest bsearch/core.py -v

      # Windows defaults to cp1252 and these scripts print non-ASCII.
      # --check recomputes every cell and compares against the committed
      # ops.json. Counts are deterministic across machines, so a mismatch is
      # a real behavioural change, not noise.
      - name: Verify operation counts against the committed table
        run: python benchmarks/ops.py --check

      # Timings are machine-specific; run it, but do not dirty the tree.
      - name: Timing smoke test (no write)
        run: python benchmarks/timing.py --no-write --quick
